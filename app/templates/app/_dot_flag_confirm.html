<dialog id="dot-flag-confirm-dialog" aria-label="Flag dot confirmation" tabindex="-1">
  <form
    id="dot-flag-confirm-form"
    method="post"
    hx-post="{% url 'dot_flag' dot.id %}"
    hx-target="#dot-editor-host"
    hx-swap="innerHTML"
  >
    {% csrf_token %}
    <h2 class="p-heading--5">Flag for review</h2>

    <div class="dot-editor-actions">
      <button type="button" class="p-button--base dialog-cancel" onclick="this.closest('dialog').close()">Cancel</button>
      <button type="submit" class="p-button--negative">Flag</button>
    </div>
  </form>
</dialog>

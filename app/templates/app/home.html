<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signal</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  </head>
  <body>
    <h1>Signal</h1>
    <p>Place a dot; select to edit; drag to move</p>

    <aside aria-label="Team drawer">
      <h2>Teams</h2>
      <form method="post" hx-post="/" hx-trigger="change from:input[name='team_ids']" hx-target="body">
        {% csrf_token %}
        <ul>
          {% for node in team_tree %}
            {% include "app/_team_tree.html" with node=node selected_team_ids=selected_team_ids only %}
          {% endfor %}
          <li>
            <input type="hidden" name="action" value="set_team_filters">
            <label>
              <input
                type="checkbox"
                name="enabled"
                value="1"
                hx-post="/"
                hx-trigger="change"
                hx-target="body"
                hx-include="[name=csrfmiddlewaretoken]"
                hx-vals='{"action":"set_my_dots_only"}'
                {% if my_dots_only %}checked{% endif %}
              >
              My dots only
            </label>
          </li>
        </ul>
      </form>
    </aside>
  </body>
</html>

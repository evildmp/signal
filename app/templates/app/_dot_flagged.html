<dialog id="dot-flagged-dialog" aria-label="Flagged dot" tabindex="-1">
  <article class="p-card">
    <h2 class="p-heading--5">Dot flagged</h2>
    <p class="p-text--small">This item has been flagged for review.</p>

    {% if can_unflag %}
      <form
        method="post"
        hx-post="{% url 'dot_unflag' dot.id %}"
        hx-target="#dot-editor-host"
        hx-swap="innerHTML"
      >
        {% csrf_token %}
        <div class="dot-editor-actions">
          <button type="submit" class="p-button signal-button--orange">Unflag</button>
          <button type="button" class="p-button--positive" onclick="this.closest('dialog').close()">OK</button>
        </div>
      </form>
    {% else %}
      <div class="dot-editor-actions">
        <button type="button" class="p-button--positive" onclick="this.closest('dialog').close()">OK</button>
      </div>
    {% endif %}
  </article>
</dialog>

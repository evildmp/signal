<span
  class="signal-dot{% if dot.is_owned_by_user %} signal-dot--claimed{% endif %}"
  data-dot-id="{{ dot.id }}"
  data-owned-by-user="{% if dot.is_owned_by_user %}1{% else %}0{% endif %}"
  hx-get="{% url 'dot_edit' dot.id %}"
  hx-target="#dot-editor-host"
  hx-swap="innerHTML"
  style="{{ dot.display_style }}"
  title="dot-{{ dot.id }}"
><span class="signal-dot-fill" aria-hidden="true"></span></span>

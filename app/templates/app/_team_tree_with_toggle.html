<ul>
  {% if toggle_field and toggle_label %}
    <li>
      <label for="{{ toggle_field.id_for_label }}">
        {{ toggle_field }}
        {{ toggle_label }}
      </label>
    </li>
  {% endif %}

  {% for node in team_tree %}
    {% include "app/_team_tree.html" with node=node selected_team_ids=selected_team_ids team_field_name=team_field_name only %}
  {% endfor %}
</ul>
